{% extends "base_layout.html" %}
{% load static %}
{% block title %}Signup{% endblock title %}
{% block content %}
<h1>Signup</h1>
<form class="form" action="{% url 'accounts:signup' %}" method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary">Sign up</button>
</form>
{% endblock content %}
